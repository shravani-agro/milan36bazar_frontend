[[redirects]]
  from = "/apk"
  to = "/milan36bazaar.apk"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "http://203.161.57.212/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/auth/*"
  to = "http://203.161.57.212/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/milan36bazaar.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=milan36bazaar.apk"
